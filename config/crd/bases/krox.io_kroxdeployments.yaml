---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: kroxdeployments.krox.io
spec:
  group: krox.io
  names:
    kind: KroxDeployment
    listKind: KroxDeploymentList
    plural: kroxdeployments
    shortNames:
    - krox
    singular: kroxdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lastAppliedRevision
      name: Revision
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KroxDeployment is a KRO RGD applied to the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KroxDeploymentSpec defines a KRO RGD render+apply unit.
            properties:
              force:
                description: Force forces server-side-apply to take ownership on conflicts.
                type: boolean
              interval:
                description: Interval is how often the controller re-renders and applies.
                type: string
              path:
                description: Path is the location of the RGD YAML inside the source
                  artifact.
                minLength: 1
                type: string
              prune:
                description: Prune deletes owned objects no longer present in the
                  latest render.
                type: boolean
              sourceRef:
                description: SourceRef points at a Flux source CR containing the RGD
                  artifact.
                properties:
                  kind:
                    enum:
                    - GitRepository
                    - OCIRepository
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - kind
                - name
                type: object
              suspend:
                description: Suspend pauses reconciliation when true.
                type: boolean
              values:
                description: |-
                  Values are the instance values for the RGD. Validated at render time
                  against the RGD's spec schema.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - interval
            - path
            - sourceRef
            type: object
          status:
            description: KroxDeploymentStatus reports the last reconcile outcome.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              inventory:
                description: ResourceInventory lists objects last applied by a KroxDeployment.
                properties:
                  entries:
                    items:
                      description: |-
                        ResourceRef is a stable identifier for an applied object.
                        ID = "<group>/<version>/<kind>/<namespace>/<name>"; cluster-scoped objects
                        use an empty namespace component (e.g. "rbac.authorization.k8s.io/v1/ClusterRole//x");
                        core group "" yields a leading slash (e.g. "/v1/ConfigMap/ns/x").
                      properties:
                        id:
                          type: string
                        v:
                          type: string
                      required:
                      - id
                      - v
                      type: object
                    type: array
                required:
                - entries
                type: object
              lastAppliedRevision:
                type: string
              lastAttemptedRevision:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

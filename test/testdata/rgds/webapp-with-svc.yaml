apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: webapp
spec:
  schema:
    apiVersion: v1alpha1
    kind: WebApp
    spec:
      name: string
      replicas: integer | default=1
      image: string
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "${schema.spec.name}"
        spec:
          replicas: "${schema.spec.replicas}"
          selector:
            matchLabels:
              app: "${schema.spec.name}"
          template:
            metadata:
              labels:
                app: "${schema.spec.name}"
            spec:
              containers:
                - name: app
                  image: "${schema.spec.image}"
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: "${schema.spec.name}-svc"
        spec:
          selector:
            app: "${schema.spec.name}"
          ports:
            - port: 80
              targetPort: 80
